[project]
name = "dext"
version = "0.1.0"
description = "Graph-driven human-assisted university faculty crawler"
requires-python = ">=3.11"
dependencies = [
    "html2text>=2024.2.26",
    "beautifulsoup4>=4.12",
    "openai>=1.40.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.19.0",
    "click>=8.1.7",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "aiohttp>=3.9.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.7.0",
    "pypdf>=6.12.2",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "qdrant-client>=1.15.0",
    "transformers>=4.46.0",
    "zstandard>=0.23.0",
    "psutil>=7.0.0",
    "neo4j>=6.2,<7",
]

[project.scripts]
crawl = "dext.cli:main"
dext = "dext_graph.cli:main"
monitor = "dext_graph.cli:monitor"
recommend = "dext_recommend.api.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dext", "src/dext_graph", "src/dext_monitor", "src/dext_grounded", "src/dext_recommend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "slow: resource-intensive acceptance tests excluded from normal runs",
    "integration: tests requiring a real local service",
]
