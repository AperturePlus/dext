name: dext-data

services:
  neo4j:
    image: neo4j:2026.05.0
    restart: unless-stopped
    mem_limit: 4g
    stop_grace_period: 2m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_server_jvm_additional: -XX:+ExitOnOutOfMemoryError
    volumes:
      - type: bind
        source: ./data/neo4j/data
        target: /data
      - type: bind
        source: ./data/neo4j/logs
        target: /logs
      - type: bind
        source: ./data/neo4j/import
        target: /import
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    mem_limit: 2g
    stop_grace_period: 1m
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    environment:
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots
    volumes:
      - type: bind
        source: ./data/qdrant/storage
        target: /qdrant/storage
      - type: bind
        source: ./data/qdrant/snapshots
        target: /qdrant/snapshots
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
